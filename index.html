<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Birthdays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #f4ecdf;
    --ink-dim: #cdbfa8;
    --bg-1: #171125;
    --bg-2: #241a35;
    --bg-3: #2e2043;
    --gold: #d8ab5e;
    --gold-soft: #e9c98a;
    --rose: #c97b84;
    --line: rgba(216,171,94,0.22);
    --ring-track: rgba(216,171,94,0.15);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 600px at 15% -10%, #3a2450 0%, transparent 60%),
      radial-gradient(ellipse 900px 700px at 90% 10%, #2b1f46 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 45%, var(--bg-1));
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 56px 20px 100px;
    position: relative;
    overflow-x: hidden;
  }

  body::before{
    content:'';
    position: fixed; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(216,171,94,0.35), transparent),
      radial-gradient(1.5px 1.5px at 70% 65%, rgba(216,171,94,0.25), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(244,236,223,0.3), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(244,236,223,0.22), transparent),
      radial-gradient(1.5px 1.5px at 55% 45%, rgba(216,171,94,0.2), transparent);
    background-size: 100% 100%;
    pointer-events:none;
    opacity:0.8;
    z-index:0;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; position:relative; z-index:1; }

  header{ text-align:center; margin-bottom: 54px; }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:0.08em;
    color: var(--gold-soft);
    font-size: 18px;
    display:block;
    margin-bottom: 10px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(38px, 6vw, 62px);
    margin: 0 0 14px;
    letter-spacing: 0.01em;
  }
  h1 em{
    font-style: italic;
    font-weight:500;
    background: linear-gradient(120deg, var(--gold-soft), var(--rose));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub{
    color: var(--ink-dim);
    font-size: 15.5px;
    max-width: 480px;
    margin: 0 auto;
    line-height:1.6;
  }
  .rule{
    width: 120px; height:1px;
    margin: 26px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .next-up{
    text-align:center;
    margin: 0 auto 50px;
    max-width: 640px;
    background: linear-gradient(180deg, rgba(216,171,94,0.08), rgba(216,171,94,0.02));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 28px;
    font-family:'Cormorant Garamond', serif;
    font-size: 20px;
    color: var(--gold-soft);
    letter-spacing:0.01em;
  }
  .next-up b{ color: var(--ink); font-weight:600; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 26px;
  }

  .card{
    position:relative;
    background: linear-gradient(160deg, var(--bg-3), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 30px 22px 26px;
    text-align:center;
    transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
    animation: rise .6s ease backwards;
  }
  .card:hover{
    transform: translateY(-6px);
    box-shadow: 0 20px 45px rgba(0,0,0,0.35), 0 0 0 1px rgba(216,171,94,0.15);
  }
  .card.today{
    box-shadow: 0 0 0 1px var(--gold), 0 18px 45px rgba(216,171,94,0.3);
  }
  .card.today::after{
    content:'✦ Today ✦';
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:13px;
    color: var(--gold-soft);
    letter-spacing:0.08em;
  }

  .ring-wrap{ position:relative; width:128px; height:128px; margin: 6px auto 18px; }
  .ring-wrap svg{ transform: rotate(-90deg); }
  .ring-track{ stroke: var(--ring-track); }
  .ring-progress{ stroke-linecap: round; transition: stroke-dashoffset 1s ease; }

  .photo{
    position:absolute; inset:14px;
    border-radius:50%;
    overflow:hidden;
    background: linear-gradient(160deg, #3a2b52, #241a35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif;
    font-size: 30px;
    color: var(--gold-soft);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  .name{
    font-family:'Playfair Display', serif;
    font-size: 22px;
    font-weight:600;
    margin: 0 0 4px;
  }
  .date{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-dim);
    font-size: 15px;
    margin: 0 0 16px;
  }

  .countdown{
    font-family:'Playfair Display', serif;
    font-size: 15.5px;
    color: var(--gold-soft);
    letter-spacing: 0.01em;
  }
  .countdown .num{
    font-size: 26px;
    font-weight:700;
    color: var(--ink);
    display:block;
    line-height:1.1;
  }

  .card-actions{
    margin-top: 16px;
    display:flex; justify-content:center; gap:14px;
  }
  .icon-btn{
    background:none; border:none; cursor:pointer;
    color: var(--ink-dim);
    font-size: 13px;
    font-family:'Inter', sans-serif;
    letter-spacing:0.03em;
    opacity:0.55;
    transition: opacity .2s, color .2s;
  }
  .icon-btn:hover{ opacity:1; color: var(--gold-soft); }

  .add-card{
    border: 1.5px dashed var(--line);
    background: transparent;
    border-radius: 22px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
    min-height: 260px;
    cursor:pointer;
    color: var(--ink-dim);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:17px;
    transition: border-color .3s, color .3s, background .3s;
  }
  .add-card:hover{
    border-color: var(--gold);
    color: var(--gold-soft);
    background: rgba(216,171,94,0.04);
  }
  .add-card .plus{
    font-family:'Playfair Display', serif;
    font-size: 34px;
    font-style: normal;
    color: var(--gold);
  }

  .empty{
    text-align:center;
    color: var(--ink-dim);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: 19px;
    padding: 40px 0 10px;
    grid-column: 1/-1;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background: rgba(10,6,18,0.72);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index: 50;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
    padding: 20px;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    background: linear-gradient(165deg, #2c2042, #1c1430);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 34px 30px;
    width: 100%; max-width: 380px;
    transform: translateY(14px) scale(0.98);
    transition: transform .3s ease;
    max-height: 88vh;
    overflow-y: auto;
  }
  .overlay.open .modal{ transform: translateY(0) scale(1); }
  .modal h2{
    font-family:'Playfair Display', serif;
    font-size: 24px;
    margin: 0 0 22px;
    text-align:center;
    font-weight:600;
  }
  .field{ margin-bottom: 16px; }
  .field label{
    display:block;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 7px;
  }
  .field input[type=text], .field input[type=date]{
    width:100%;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,0.2);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size: 14.5px;
  }
  .field input:focus{ outline: 2px solid var(--gold); outline-offset: 1px; }
  .colorpick{ display:flex; gap:10px; flex-wrap:wrap; }
  .colorpick span{
    width:28px; height:28px; border-radius:50%;
    cursor:pointer; border: 2px solid transparent;
    display:inline-block;
  }
  .colorpick span.selected{ border-color: #fff; }
  .photo-pick{
    display:flex; align-items:center; gap: 14px;
  }
  .photo-pick .preview{
    width:56px; height:56px; border-radius:50%;
    background: rgba(216,171,94,0.1);
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
    color: var(--ink-dim);
    font-size: 11px;
  }
  .photo-pick .preview img{ width:100%; height:100%; object-fit:cover; }
  .photo-pick label.filebtn{
    font-size: 13px;
    color: var(--gold-soft);
    cursor:pointer;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 8px;
    transition: border-color .2s;
  }
  .photo-pick label.filebtn:hover{ border-color: var(--gold); }
  .photo-pick input[type=file]{ display:none; }

  .modal-actions{
    display:flex; gap: 12px; margin-top: 24px;
  }
  .btn{
    flex:1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 14px;
    cursor:pointer;
    letter-spacing: 0.02em;
  }
  .btn.primary{
    background: linear-gradient(120deg, var(--gold), var(--gold-soft));
    color: #241a35;
  }
  .btn.ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
  }
  .btn.danger{
    background: transparent;
    border: 1px solid rgba(201,123,132,0.5);
    color: var(--rose);
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  footer{
    text-align:center;
    margin-top: 70px;
    color: var(--ink-dim);
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .ring-progress{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">A little book of dates</span>
    <h1>Family <em>Birthdays</em></h1>
    <p class="sub">Every name here is a day worth waiting for. Watch the countdown carry you there.</p>
    <div class="rule"></div>
  </header>

  <div id="nextUp"></div>

  <div class="grid" id="grid"></div>
</div>

<footer>made with care, one candle at a time</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Add a birthday</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="fName" placeholder="e.g. Maa">
    </div>
    <div class="field">
      <label>Birthday</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>Ring colour</label>
      <div class="colorpick" id="colorPick">
        <span data-c="#e9c98a" style="background:#e9c98a" class="selected"></span>
        <span data-c="#c97b84" style="background:#c97b84"></span>
        <span data-c="#7fc4b8" style="background:#7fc4b8"></span>
        <span data-c="#a78bda" style="background:#a78bda"></span>
        <span data-c="#e2896b" style="background:#e2896b"></span>
        <span data-c="#7ea8d8" style="background:#7ea8d8"></span>
      </div>
    </div>
    <div class="field">
      <label>Photo (optional)</label>
      <div class="photo-pick">
        <div class="preview" id="fPreview">none</div>
        <label class="filebtn">Choose photo<input type="file" id="fPhoto" accept="image/*"></label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
    <div class="modal-actions" id="deleteRow" style="display:none;">
      <button class="btn danger" id="deleteBtn">Remove this person</button>
    </div>
  </div>
</div>

let people = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || seedPeople;
let editingId = null;
let tempPhoto = null;
let tempColor = '#e9c98a';

const grid = document.getElementById('grid');
const nextUp = document.getElementById('nextUp');
const overlay = document.getElementById('overlay');

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
}

function daysUntilNextBirthday(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const bday = new Date(dateStr);
  let next = new Date(today.getFullYear(), bday.getMonth(), bday.getDate());
  if(next < today){
    next = new Date(today.getFullYear()+1, bday.getMonth(), bday.getDate());
  }
  const diff = Math.round((next - today) / 86400000);
  return diff;
}

function turningAge(dateStr){
  const today = new Date();
  const bday = new Date(dateStr);
  let nextYear = today.getFullYear();
  const next = new Date(nextYear, bday.getMonth(), bday.getDate());
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if(next < t0) nextYear += 1;
  return nextYear - bday.getFullYear();
}

function formatDate(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { month:'long', day:'numeric' });
}

function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function hexToRgba(hex, alpha){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function render(){
  grid.innerHTML = '';

  if(people.length === 0){
    grid.innerHTML = '<div class="empty">No birthdays added yet — add your first family member below.</div>';
    nextUp.innerHTML = '';
  } else {
    const sorted = [...people].sort((a,b)=> daysUntilNextBirthday(a.date) - daysUntilNextBirthday(b.date));
    const soonest = sorted[0];
    const days = daysUntilNextBirthday(soonest.date);
    if(days === 0){
      nextUp.innerHTML = `<div class="next-up">✦ It's <b>${soonest.name}'s</b> birthday today! ✦</div>`;
    } else {
      nextUp.innerHTML = `<div class="next-up">Next up: <b>${soonest.name}</b> in <b>${days}</b> day${days===1?'':'s'}</div>`;
    }

    sorted.forEach((p, i) => {
      const days = daysUntilNextBirthday(p.date);
      const isToday = days === 0;
      const age = turningAge(p.date);
      const color = p.color || '#e9c98a';
      const circumference = 2 * Math.PI * 54;
      const progress = isToday ? 0 : circumference * (1 - (days/365));
      const clampedProgress = Math.max(0, Math.min(circumference, progress));

      const card = document.createElement('div');
      card.className = 'card' + (isToday ? ' today' : '');
      card.style.animationDelay = (i * 0.06) + 's';
      card.style.borderColor = isToday ? color : 'var(--line)';
      if(isToday){
        card.style.boxShadow = `0 0 0 1px ${color}, 0 18px 45px ${hexToRgba(color,0.35)}`;
      }

      const photoHTML = p.photo
        ? `<img src="${p.photo}" alt="${p.name}">`
        : initials(p.name);

      const ageText = p.unknownYear ? '' : ` · turning ${age}`;

      card.innerHTML = `
        <div class="ring-wrap">
          <svg width="128" height="128">
            <circle class="ring-track" cx="64" cy="64" r="54" fill="none" stroke-width="4"></circle>
            <circle class="ring-progress" cx="64" cy="64" r="54" fill="none" stroke-width="4" stroke="${color}"
              style="filter: drop-shadow(0 0 5px ${hexToRgba(color,0.55)});"
              stroke-dasharray="${circumference}" stroke-dashoffset="${circumference - clampedProgress}"></circle>
          </svg>
          <div class="photo" style="border-color:${hexToRgba(color,0.5)}">${photoHTML}</div>
        </div>
        <p class="name">${p.name}</p>
        <p class="date">${formatDate(p.date)}</p>
        <div class="countdown">
          ${isToday
            ? `<span class="num">🎂 Today!</span>${p.unknownYear ? '' : 'turns '+age}`
            : `<span class="num" style="color:${color}">${days}</span>day${days===1?'':'s'} to go${ageText}`
          }
        </div>
        <div class="card-actions">
          <button class="icon-btn" onclick="openEdit('${p.id}')">Edit</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  const addCard = document.createElement('div');
  addCard.className = 'add-card';
  addCard.innerHTML = `<span class="plus">+</span> Add a birthday`;
  addCard.onclick = () => openAdd();
  grid.appendChild(addCard);
}

function setSelectedColor(hex){
  tempColor = hex;
  document.querySelectorAll('#colorPick span').forEach(s=>{
    s.classList.toggle('selected', s.dataset.c === hex);
  });
}

document.getElementById('colorPick').addEventListener('click', (e)=>{
  if(e.target.tagName === 'SPAN'){
    setSelectedColor(e.target.dataset.c);
  }
});

function openAdd(){
  editingId = null;
  tempPhoto = null;
  setSelectedColor('#e9c98a');
  document.getElementById('modalTitle').textContent = 'Add a birthday';
  document.getElementById('fName').value = '';
  document.getElementById('fDate').value = '';
  document.getElementById('fPreview').innerHTML = 'none';
  document.getElementById('deleteRow').style.display = 'none';
  overlay.classList.add('open');
}

function openEdit(id){
  const p = people.find(x => x.id === id);
  if(!p) return;
  editingId = id;
  tempPhoto = p.photo || null;
  setSelectedColor(p.color || '#e9c98a');
  document.getElementById('modalTitle').textContent = 'Edit birthday';
  document.getElementById('fName').value = p.name;
  document.getElementById('fDate').value = p.unknownYear ? '' : p.date;
  document.getElementById('fPreview').innerHTML = p.photo ? `<img src="${p.photo}">` : 'none';
  document.getElementById('deleteRow').style.display = 'flex';
  overlay.classList.add('open');
}

document.getElementById('cancelBtn').onclick = () => overlay.classList.remove('open');
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('fPhoto').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    tempPhoto = ev.target.result;
    document.getElementById('fPreview').innerHTML = `<img src="${tempPhoto}">`;
  };
  reader.readAsDataURL(file);
});

document.getElementById('saveBtn').onclick = function(){
  const name = document.getElementById('fName').value.trim();
  const date = document.getElementById('fDate').value;
  if(!name || !date){
    alert('Please add a name and a birthday.');
    return;
  }
  if(editingId){
    const p = people.find(x => x.id === editingId);
    p.name = name; p.date = date; p.photo = tempPhoto; p.color = tempColor; p.unknownYear = false;
  } else {
    people.push({ id: Date.now().toString(), name, date, photo: tempPhoto, color: tempColor, unknownYear: false });
  }
  save();
  render();
  overlay.classList.remove('open');
};

document.getElementById('deleteBtn').onclick = function(){
  if(!editingId) return;
  if(confirm('Remove this person?')){
    people = people.filter(x => x.id !== editingId);
    save();
    render();
    overlay.classList.remove('open');
  }
};

render();
</script>

</body>
</html>
